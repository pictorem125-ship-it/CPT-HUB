<style>
*{box-sizing:border-box}

button{font:inherit;cursor:pointer}
.app{max-width:1500px;margin:auto;padding:8px}

.side{padding:9px}.side-title{color:#9eb2c2;font-size:10px;margin-bottom:6px}.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff10}.side .barbg{margin:8px 0 13px}
.bottom{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:7px;margin-top:7px}.panel{padding:10px}.buildbar{display:flex;gap:5px;overflow:auto;margin-top:7px}.builditem{min-width:100px;padding:7px;background:#101f2d;border:1px solid #29465b;border-radius:6px;text-align:center}.builditem span{display:block;font-size:21px}.builditem b{font-size:10px}.builditem strong{display:block;color:var(--yellow);font-size:10px}
.btn{padding:8px 11px;border-radius:6px;background:#142b3d;color:#e4edf3;border:1px solid #31536a;font-weight:850}.primary{background:#e98721;color:#180d04;border-color:#ffb15c}.greenbtn{background:#125e45;border-color:#27b27e}.danger{background:#67202a;border-color:#a93446}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.modalbg{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:10px;z-index:20}.modalbg.open{display:flex}.modal{width:min(1000px,100%);max-height:92vh;overflow:auto;padding:12px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.modal h2{margin:0;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px}.tile{background:#0f1e2b;border:1px solid #29465b;border-radius:7px;padding:10px}.tile b{display:block}.tile strong{display:block;margin-top:7px;color:var(--yellow)}

.toast{position:fixed;right:12px;bottom:12px;background:#102d3e;border:1px solid #347c9c;padding:9px 13px;border-radius:7px;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1}

</style>

fr);gap:2%}.s2dock{position:relative;background:linear-gradient(#3d4446,#777c7b 48%,#273035);border:2px solid #11181d;border-radius:5px;box-shadow:inset 0 0 0 2px #a9aaa5}.s2dock span{position:absolute;top:-25px;left:34%;background:#0d1721;border:1px solid #758b98;padding:3px 6px;border-radius:4px;font-weight:900}.s2dock:after{content:"";position:absolute;left:20%;right:20%;bottom:-18px;height:19px;background:#1671a9;border:2px solid #0c2b42}.s2floor{position:absolute;left:7%;right:7%;top:25%;bottom:13%;border:4px dashed #f3ad12;background-color:#5b5b58;background-image:linear-gradient(#fff2 1px,transparent 1px),linear-gradient(90deg,#fff2 1px,transparent 1px);background-size:58px 58px}.s2bottom{position:absolute;left:0;right:0;bottom:0;height:13%;background:#202a30;border-top:3px solid #4d606a;display:flex;gap:7px;padding:8px 9%}.s2room{flex:1;border:2px solid #3a4c55;background:linear-gradient(#2a383e,#121a1f);position:relative}.s2room b{position:absolute;bottom:3px;left:5px;font-size:8px;color:#9eb0ba}.s2modules{position:absolute;left:10%;right:10%;top:31%;bottom:18%;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:9px}.s2mod{border:2px solid #27495b;border-radius:7px;background:linear-gradient(145deg,#1b526c,#0d2734);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:inset 0 0 13px #39c8ff22}.s2mod.pack{background:linear-gradient(145deg,#68451a,#2b1e0e);border-color:#9e7029}.s2mod.sort{background:linear-gradient(145deg,#2e563a,#13281b);border-color:#4d9363}.s2mod.slam{background:linear-gradient(145deg,#54273d,#26141e);border-color:#a34e72}.s2mod small{position:absolute;margin-top:60px;font-size:8px;color:#c7d5dc}.s2worker{position:absolute;width:14px;height:21px;border-radius:9px 9px 4px 4px;background:#e8a11b;box-shadow:0 0 0 2px #1a242a}.s2worker:before{content:"";position:absolute;left:3px;top:-6px;width:8px;height:8px;border-radius:50%;background:#d7ab7d}.s2truck{position:absolute;left:-260px;top:48%;width:235px;height:72px;z-index:10}.s2trailer{position:absolute;left:0;top:8px;width:115px;height:58px;background:linear-gradient(#e3e6e6,#777f82);border:3px solid #202629;border-radius:5px}.s2cab{position:absolute;right:0;top:12px;width:78px;height:55px;background:linear-gradient(#f4b62a,#c6750c);border:3px solid #382713;border-radius:8px}.s2window{position:absolute;left:9px;top:7px;width:55px;height:20px;background:#163444;border:2px solid #73909c}.s2wheel{position:absolute;bottom:-10px;width:28px;height:28px;border-radius:50%;background:#111;border:5px solid #4b555b}.s2w1{left:20px}.s2w2{left:130px}.s2w3{right:8px}.s2truck.arrive{animation:s2arrive 4s linear forwards}.s2truck.unload{animation:s2unload 2s ease-in-out forwards}.s2truck.exit{animation:s2exit 3.5s linear forwards}@keyframes s2arrive{to{left:43%}}@keyframes s2unload{to{left:49%}}@keyframes s2exit{to{left:108%}}.s2reward{position:absolute;left:50%;top:43%;z-index:30;font-weight:900;font-size:20px;animation:s2reward 1.5s ease-out forwards;text-shadow:0 2px 5px #000}.s2reward.money{color:#ffd54b}.s2reward.xp{color:#62d9ff;top:49%}@keyframes s2reward{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-65px) scale(1.1)}}.s2bar{margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:10px}.s2big{font-size:21px;font-weight:900}.s2button{border:1px solid #315064;background:#122534;border-radius:7px;padding:8px 12px;font-weight:900}.s2button.green{background:#123d2d;border-color:#23815d}.s2progress{height:8px;background:#142634;border-radius:20px;overflow:hidden}.s2progress i{display:block;height:100%;background:linear-gradient(90deg,#20e88a,#26c8ff)}.s2events{height:110px;overflow:auto;font-size:10px;background:#08121b;border:1px solid #203544;border-radius:8px;padding:5px;margin-top:7px}.s2log{padding:4px 2px;border-bottom:1px solid #132532}.s2tabs{display:flex;gap:5px;margin-bottom:8px}.s2tabs button{flex:1;background:#0d1b27;border:1px solid #294052;border-radius:6px;padding:8px;font-weight:800}.s2tabs button.active{background:#21465a;border-color:#4d88a5}.s2upgrades{display:flex;flex-direction:column;gap:7px;max-height:620px;overflow:auto}.s2up{background:#0a1722;border:1px solid #263e50;border-radius:9px;padding:8px}.s2uphead{display:flex;align-items:center;gap:7px}.s2upicon{width:35px;height:35px;display:grid;place-items:center;background:#172b3b;border-radius:7px;font-size:19px}.s2upname{font-weight:900}.s2uplvl{margin-left:auto;color:#26c8ff;font-weight:900}.s2desc{font-size:10px;color:#8da4b4;margin:4px 0}.s2row{display:flex;justify-content:space-between;align-items:center}.s2price{color:#ffc21c;font-weight:900}.s2buy{background:#123d2d;border:1px solid #25835e;border-radius:6px;padding:6px 9px;font-weight:900}.s2buy:disabled{opacity:.35}.s2stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.s2stat{background:#0a1520;border:1px solid #213746;border-radius:8px;padding:8px}.s2stat b{display:block;font-size:16px;margin-top:3px}.s2toast{position:fixed;right:18px;bottom:18px;background:#102433;border:1px solid #2d7189;border-radius:9px;padding:10px 14px;z-index:100;transform:translateY(130%);transition:.25s;box-shadow:0 12px 35px #000b}.s2toast.show{transform:none}.s2level{position:absolute;inset:0;background:#031018bb;z-index:60;display:none;place-items:center}.s2level.show{display:grid}.s2levelCard{background:#102638;border:1px solid #38baff;border-radius:12px;padding:25px;text-align:center;box-shadow:0 0 40px #28c8ff55}.s2levelCard .star{font-size:52px}@media(max-width:1050px){.s2top{grid-template-columns:1fr 1fr}.s2layout{grid-template-columns:135px 1fr}.s2right{grid-column:1/-1}.s2upgrades{display:grid;grid-template-columns:repeat(2,1fr);max-height:none}}@media(max-width:700px){#sptv2{padding:4px}.s2layout{grid-template-columns:1fr}.s2nav{display:grid;grid-template-columns:repeat(3,1fr)}.s2nav button{text-align:center;padding:0 5px;font-size:11px}.s2warehouse{height:430px}.s2upgrades{grid-template-columns:1fr}.s2top .s2brand{grid-column:span 2}.s2truck{transform:scale(.72);transform-origin:left center}}
</style>
<div id="sptv2">
<div class="s2top"><div class="s2card s2brand"><div class="s2icon">📦</div><div><div class="s2title">SPT HUB</div><div class="s2muted">WAREHOUSE SIMULATOR v2.0</div></div></div><div class="s2card s2test"><b class="s2green">🧪 TEST MODE</b><div class="s2muted">x60 SPEED • 5 MIN SHIFT</div></div><div class="s2card"><div class="s2muted">ДЕНЬГИ</div><div class="s2val s2yellow" id="v2money"></div></div><div class="s2card"><div class="s2muted">СКЛАД • LEVEL <span id="v2level"></span></div><div class="s2progress"><i id="v2xpbar"></i></div><div class="s2muted"><span id="v2xp"></span> / <span id="v2need"></span> XP</div></div><div class="s2card"><div class="s2muted">СМЕНА</div><div class="s2val">06:00 — 16:00</div><div class="s2yellow" id="v2state"></div></div><div class="s2card"><button class="s2pause" id="v2pause">Ⅱ</button></div></div>
<div class="s2layout"><nav class="s2nav"><button class="active" id="v2navWarehouse">🏠 Склад</button><button id="v2navUpgrades">⚙ Улучшения</button><button id="v2navStats">📊 Статистика</button></nav>
<main><section class="s2warehouse" id="v2warehouse"><div class="s2wall"></div><div class="s2roof"></div><div class="s2lights"><i class="s2lamp"></i><i class="s2lamp"></i><i class="s2lamp"></i><i class="s2lamp"></i><i class="s2lamp"></i></div><div class="s2docks" id="v2docks"></div><div class="s2floor"></div><div class="s2modules" id="v2modules"></div><div id="v2workers"></div><div class="s2bottom"><div class="s2room"><b>STAFF</b></div><div class="s2room"><b>CONTROL</b></div><div class="s2room"><b>MAINT</b></div><div class="s2room"><b>STORAGE</b></div></div><div class="s2truck" id="v2truck"><div class="s2trailer"></div><div class="s2cab"><div class="s2window"></div></div><i class="s2wheel s2w1"></i><i class="s2wheel s2w2"></i><i class="s2wheel s2w3"></i></div><div class="s2level" id="v2levelPopup"><div class="s2levelCard"><div class="star">⭐</div><h2>СКЛАД ПОВЫШЕН!</h2><div class="s2big">LEVEL <span id="v2newLevel"></span></div><button class="s2button green" id="v2closeLevel">Продолжить</button></div></div></section><section class="s2panel s2bar"><div><div class="s2muted">ПРОГРЕСС ТЕКУЩЕЙ СМЕНЫ</div><div class="s2big"><span id="v2packages"></span> / <span id="v2target"></span> 📦</div></div><div><div class="s2muted">ЭФФЕКТИВНОСТЬ</div><div class="s2big s2green" id="v2eff"></div></div><button class="s2button" id="v2newShift">Новая смена</button></section><div class="s2events" id="v2events"></div></main>
<aside class="s2right"><div class="s2panel"><div class="s2tabs"><button class="active" id="v2tabUp">Улучшения</button><button id="v2tabStats">Статы</button></div><div id="v2right"></div></div></aside></div><div class="s2toast" id="v2toast"></div></div>
<script>
(function(){'use strict';
const KEY='spt_hub_v2_playable',SPEED=60,SHIFT=600;
const U=[
['dock','🚛','Доковые ворота','Больше прицепов одновременно',5000,10,l=>({trucks:l}),l=>'+ '+l+' ворот'],
['conveyor','↔️','Конвейеры','Увеличивают поток посылок',3500,12,l=>'+ '+l*12+'/ч'],
['sorter','🔀','Автосортировка','Ускоряет сортировку и даёт XP',7000,10,l=>'+ '+l*15+'/ч • +'+l+'% XP'],
['pack','📦','Pack станции','Больше упаковочных мест',6000,12,l=>'+ '+l*14+'/ч • +'+l*1.5+'% денег'],
['slam','⚡','SLAM','Финальная обработка быстрее',9000,10,l=>'+ '+l*11+'/ч • +'+l*2+'% денег'],
['workers','👷','Команда','Каждый уровень добавляет работника',4500,15,l=>'+ '+l+' рабочих • +'+l*2+'% эфф.'],
['scanner','🔎','Сканеры','Быстрее обработка и больше XP',4000,10,l=>'+ '+l*8+'/ч • +'+l*2+'% XP'],
['forklift','🏗️','Погрузчики','Ускоряют разгрузку прицепов',3000,10,l=>'+ '+l*5+'% разгрузка'],
['trailer','🚚','Вместимость прицепов','Больше посылок с каждого прицепа',5500,10,l=>'+ '+l*40+' 📦/прицеп'],
['training','🎓','Обучение','Больше XP за ту же работу',2500,15,l=>'+ '+l*3+'% XP'],
['automation','🤖','Автоматизация','Глобальный бонус к потоку',12000,8,l=>'+ '+l*3+'% поток'],
['lighting','💡','Освещение','Повышает эффективность склада',2200,10,l=>'+ '+l*1.5+'% эфф.']
];
function fresh(){return{money:1000000,xp:0,level:1,shift:0,packages:0,target:1000,paused:false,completed:0,totalPackages:0,totalEarned:0,upgrades:Object.fromEntries(U.map(x=>[x[0],0]))}}
let S=fresh();try{const q=JSON.parse(localStorage.getItem(KEY)||'null');if(q){S=Object.assign(S,q);S.upgrades=Object.assign(fresh().upgrades,q.upgrades||{})}}catch(e){}
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('pl-PL'),need=()=>Math.round(1000*Math.pow(1.42,S.level-1)),cost=u=>Math.round(u[4]*Math.pow(1.48,S.upgrades[u[0]]||0)*(1+(S.upgrades[u[0]]||0)*.08));
function eff(){let e={flow:220,money:0,xp:0,eff:0,workers:6,trucks:1,cap:140,unload:0,global:0};U.forEach(u=>{let l=S.upgrades[u[0]]||0;if(u[0]==='dock')e.trucks+=l;if(u[0]==='conveyor')e.flow+=l*12;if(u[0]==='sorter'){e.flow+=l*15;e.xp+=l}if(u[0]==='pack'){e.flow+=l*14;e.money+=l*1.5}if(u[0]==='slam'){e.flow+=l*11;e.money+=l*2}if(u[0]==='workers'){e.workers+=l;e.eff+=l*2}if(u[0]==='scanner'){e.flow+=l*8;e.xp+=l*2}if(u[0]==='forklift')e.unload+=l*5;if(u[0]==='trailer')e.cap+=l*40;if(u[0]==='training')e.xp+=l*3;if(u[0]==='automation')e.global+=l*3;if(u[0]==='lighting')e.eff+=l*1.5});e.flow*=1+e.global/100;e.eff=100+e.eff;return e}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function log(t){let e=$('v2events'),d=document.createElement('div');d.className='s2log';d.textContent=t;e.prepend(d);while(e.children.length>12)e.lastChild.remove()}
function toast(t){let e=$('v2toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function fly(t,c){let d=document.createElement('div');d.className='s2reward '+c;d.textContent=t;$('v2warehouse').appendChild(d);setTimeout(()=>d.remove(),1600)}
function reward(n){let e=eff(),m=Math.round(n*(1.2+e.money/100)),x=Math.round(n*(.55+e.xp/100));S.money+=m;S.xp+=x;S.totalPackages+=n;S.totalEarned+=m;S.packages=Math.min(S.target,S.packages+n);fly('💰 +'+fmt(m)+' zł','money');fly('⭐ +'+x+' XP','xp');while(S.xp>=need()){S.xp-=need();S.level++;S.target=1000+S.level*120;$('v2newLevel').textContent=S.level;$('v2levelPopup').classList.add('show');log('⭐ Склад LEVEL '+S.level)}save()}
function renderWarehouse(){let d=$('v2docks');d.innerHTML='';let e=eff();for(let i=0;i<6;i++){let x=document.createElement('div');x.className='s2dock';x.innerHTML='<span>0'+(i+1)+'</span>';x.style.opacity=i<e.trucks?'1':'.42';d.appendChild(x)}let z=$('v2modules');z.innerHTML='';[['sorter','sort','🔀','SORT'],['pack','pack','📦','PACK'],['slam','slam','⚡','SLAM'],['conveyor','','↔️','FLOW']].forEach(a=>{let n=Math.min(12,Math.max(1,S.upgrades[a[0]]||1));for(let i=0;i<n;i++){let m=document.createElement('div');m.className='s2mod '+a[1];m.textContent=a[2];let sm=document.createElement('small');sm.textContent=a[3]+' '+(i+1);m.appendChild(sm);z.appendChild(m)}});let w=$('v2workers');w.innerHTML='';for(let i=0;i<Math.min(25,e.workers);i++){let p=document.createElement('i');p.className='s2worker';p.style.left=(6+(i*17)%88)+'%';p.style.top=(7+(i*29)%84)+'%';w.appendChild(p)}}
function renderRight(){let box=document.createElement('div');box.className='s2upgrades';box.id='v2ups';U.forEach(u=>{let l=S.upgrades[u[0]]||0,max=l>=u[5],p=cost(u),d=document.createElement('div');d.className='s2up';d.innerHTML='<div class="s2uphead"><div class="s2upicon">'+u[1]+'</div><div><div class="s2upname">'+u[2]+'</div><div class="s2muted">Уровень '+l+' / '+u[5]+'</div></div><div class="s2uplvl">LV '+l+'</div></div><div class="s2desc">'+u[3]+'</div><div class="s2desc"><span class="s2green">Сейчас: '+u[6](l)+'</span><br><span class="s2cyan">После: '+u[6](l+1)+'</span></div><div class="s2row"><span class="s2price">'+(max?'MAX':fmt(p)+' zł')+'</span><button class="s2buy" data-buy="'+u[0]+'" '+(max||S.money<p?'disabled':'')+'>'+(max?'MAX':'КУПИТЬ')+'</button></div>';box.appendChild(d)});$('v2right').innerHTML='<h3>УЛУЧШЕНИЯ</h3>';$('v2right').appendChild(box);box.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy))}
function stats(){let e=eff();$('v2right').innerHTML='<h3>СТАТИСТИКА</h3><div class="s2stats">'+[['Поток',Math.round(e.flow)+'/ч'],['Рабочие',e.workers],['XP бонус','+'+e.xp+'%'],['Деньги бонус','+'+e.money+'%'],['Прицеп',e.cap+' 📦'],['Смены',S.completed],['Всего 📦',fmt(S.totalPackages)],['Заработано',fmt(S.totalEarned)+' zł']].map(a=>'<div class="s2stat">'+a[0]+'<b>'+a[1]+'</b></div>').join('')+'</div><p class="s2muted">После окончания смены сбрасываются только её пакеты и время. Улучшения, XP склада, деньги и уровень сохраняются.</p>'}
function render(){let e=eff();$('v2money').textContent=fmt(S.money)+' zł';$('v2level').textContent=S.level;$('v2xp').textContent=fmt(S.xp);$('v2need').textContent=fmt(need());$('v2xpbar').style.width=Math.min(100,S.xp/need()*100)+'%';$('v2packages').textContent=fmt(S.packages);$('v2target').textContent=fmt(S.target);$('v2eff').textContent=Math.round(e.eff)+'%';$('v2state').textContent=S.shift>=SHIFT?'Смена завершена':'Тест: 5 мин (x60)';$('v2pause').textContent=S.paused?'▶':'Ⅱ';renderWarehouse();renderRight()}
function buy(id){let u=U.find(x=>x[0]===id),l=S.upgrades[id]||0,p=cost(u);if(l>=u[5]||S.money<p)return;S.money-=p;S.upgrades[id]=l+1;save();render();log('🔧 '+u[2]+' → уровень '+(l+1)+' • −'+fmt(p)+' zł');toast(u[1]+' '+u[2]+' улучшен — склад изменился')}
function truck(){if(S.paused||S.shift>=SHIFT)return;let t=$('v2truck');t.className='s2truck arrive';t.onanimationend=()=>{if(t.classList.contains('arrive')){t.className='s2truck unload';setTimeout(()=>{let e=eff(),n=Math.min(e.cap,Math.max(18,Math.round(e.flow/12)));reward(n);log('🚚 Прицеп заехал: +'+n+' 📦 • награда начислена');t.className='s2truck exit';setTimeout(()=>t.className='s2truck',3600)},2100)}}}
function finish(){if(S.shift<SHIFT)return;let pct=S.packages/S.target,bonus=Math.round(300*S.level*pct);if(pct>=1)bonus+=800*S.level;S.money+=bonus;S.completed++;log('🏁 Смена завершена • '+S.packages+'/'+S.target+' 📦 • бонус '+fmt(bonus)+' zł');toast('Смена закончилась. Прогресс смены сброшен.');S.shift=0;S.packages=0;save();render()}
